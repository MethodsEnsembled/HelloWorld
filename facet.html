<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1033">
<title>Facet</title>
<style>
  :root {
    --bg: #1a1033;
    --panel: #2a1a4a;
    --cell: rgba(255,255,255,0.05);
    --text: #f6f3ff;
    --accent: #ffd166;
    --muted: rgba(246,243,255,0.72);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(ellipse at top, #2a1a4a 0%, var(--bg) 60%, #0a0520 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  header {
    width: 100%; max-width: 520px;
    padding: 14px 18px 6px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .icon-btn {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 50%;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none;
    color: var(--text);
    font-size: 18px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .icon-btn:active { background: var(--accent); color: #1a1033; transform: scale(0.94); }
  h1 {
    margin: 0; font-size: clamp(18px, 4.5vw, 26px);
    letter-spacing: 3px; font-weight: 800;
    background: linear-gradient(135deg, #ffd166, #ef476f, #06d6a0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stats { display: flex; gap: 6px; align-items: center; }
  .stat {
    background: var(--panel); border-radius: 10px;
    padding: 6px 10px; font-size: 10px; text-align: center;
    min-width: 50px; line-height: 1.2;
    letter-spacing: 0.8px; color: var(--muted);
  }
  .stat b { display: block; font-size: 16px; color: var(--accent); letter-spacing: 0; }
  .stat.gems b { color: #fff3a0; }

  .play {
    flex: 1;
    width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
    touch-action: none;
  }
  .stage {
    position: relative;
    width: min(92vmin, 460px);
    height: min(92vmin, 460px);
    display: flex; align-items: center; justify-content: center;
  }

  .board {
    width: 70.7%;
    height: 70.7%;
    transform: rotate(45deg);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 5px;
    padding: 5px;
    background: var(--panel);
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.3);
  }
  .cell {
    background: var(--cell);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
  }
  .cell span {
    display: inline-block;
    transform: rotate(-45deg);
    font-weight: 800;
    letter-spacing: -0.5px;
    font-size: clamp(11px, 3.0vmin, 18px);
  }
  .cell.d3 span { font-size: clamp(13px, 3.5vmin, 22px); }
  .cell.d2 span { font-size: clamp(16px, 4.2vmin, 28px); }
  .cell.d1 span { font-size: clamp(20px, 5vmin, 32px); }

  /* Solid color first so a rotated board still reads if gradients drop. */
  .v2048 { background-color: #ff2e4d; background-image: linear-gradient(135deg, #8b0000, #ff2e4d); color: #fff; }
  .v1024 { background-color: #ff6b35; background-image: linear-gradient(135deg, #b8390e, #ff6b35); color: #fff; }
  .v512  { background-color: #ff9f1c; background-image: linear-gradient(135deg, #c77800, #ff9f1c); color: #fff; }
  .v256  { background-color: #ffd23f; background-image: linear-gradient(135deg, #9a8200, #ffd23f); color: #222; }
  .v128  { background-color: #a8dc00; background-image: linear-gradient(135deg, #5a8f00, #a8dc00); color: #222; }
  .v64   { background-color: #06d6a0; background-image: linear-gradient(135deg, #007f3f, #06d6a0); color: #fff; }
  .v32   { background-color: #00b7d4; background-image: linear-gradient(135deg, #007c8f, #00b7d4); color: #fff; }
  .v16   { background-color: #118ab2; background-image: linear-gradient(135deg, #0b3d91, #118ab2); color: #fff; }
  .v8    { background-color: #7209b7; background-image: linear-gradient(135deg, #3a0ca3, #7209b7); color: #fff; }
  .v4    { background-color: #c77dff; background-image: linear-gradient(135deg, #6a1b9a, #c77dff); color: #fff; }
  .v2    {
    background-color: #ffd700;
    background-image: linear-gradient(135deg, #ffd700, #fff3a0);
    color: #222;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4), 0 0 24px #ffd70088;
  }

  .arrow {
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    z-index: 5;
  }
  .arrow:active { background: var(--accent); color: #1a1033; transform: scale(0.92); }
  .arrow.ne { top: 8%;     right: 8%; }
  .arrow.nw { top: 8%;     left: 8%; }
  .arrow.se { bottom: 8%;  right: 8%; }
  .arrow.sw { bottom: 8%;  left: 8%; }

  .floater {
    position: absolute; left: 50%; top: 10%;
    transform: translateX(-50%);
    font-weight: 800; letter-spacing: 1px;
    color: var(--accent);
    text-shadow: 0 0 14px rgba(255,209,102,0.8);
    opacity: 0; pointer-events: none;
    font-size: 18px;
    z-index: 6;
  }
  .floater.show { animation: floatUp 0.7s ease-out; }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 8px); }
    20% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -18px); }
  }

  footer {
    width: 100%; max-width: 520px;
    padding: 8px 18px 16px;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  .help { font-size: 12px; opacity: 0.75; text-align: center; line-height: 1.4; }
  .help b { color: var(--accent); }
  button.primary {
    background: var(--accent); color: #1a1033;
    border: none; border-radius: 10px;
    padding: 10px 20px; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  button.primary:active { transform: scale(0.97); }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 5, 30, 0.85);
    display: none;
    align-items: center; justify-content: center;
    z-index: 10;
    backdrop-filter: blur(6px);
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--panel);
    border-radius: 16px;
    padding: 24px 28px;
    text-align: center;
    max-width: 300px;
    border: 1px solid rgba(255,209,102,0.2);
  }
  .modal h2 { margin: 0 0 10px; color: var(--accent); letter-spacing: 1px; }
  .modal p { margin: 0 0 16px; opacity: 0.85; font-size: 14px; line-height: 1.45; }
</style>
</head>
<body>
  <header>
    <div class="header-left">
      <a class="icon-btn" href="index.html" aria-label="Back to arcade">←</a>
      <h1>FACET</h1>
    </div>
    <div class="stats">
      <div class="stat">SCORE<b id="score">0</b></div>
      <div class="stat gems">GEMS<b id="gems">0</b></div>
      <div class="stat">BEST<b id="best">0</b></div>
      <button class="icon-btn" id="muteBtn" aria-label="Mute">♪</button>
    </div>
  </header>

  <div class="play" id="play">
    <div class="stage" id="stage">
      <button class="arrow nw" data-dir="left"  aria-label="Up-left">↖</button>
      <button class="arrow ne" data-dir="up"    aria-label="Up-right">↗</button>
      <button class="arrow sw" data-dir="down"  aria-label="Down-left">↙</button>
      <button class="arrow se" data-dir="right" aria-label="Down-right">↘</button>
      <div class="board" id="board"></div>
      <div class="floater" id="floater"></div>
    </div>
  </div>

  <footer>
    <div class="help">
      Swipe the diamond. Matches <b>halve</b>. A <b>2</b> is a gem — it leaves the board.
    </div>
    <button class="primary" id="newGame">New Game</button>
  </footer>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">Vein closed</h2>
      <p id="modalText">No more cuts.</p>
      <button class="primary" id="modalBtn">Play Again</button>
    </div>
  </div>

<script>
(() => {
  const SIZE = 4;
  const WIN = 2;
  const BEST_KEY = 'facet_best_gems';
  const MUTE_KEY = 'facet_mute';

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const gemsEl = document.getElementById('gems');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');
  const muteBtn = document.getElementById('muteBtn');
  const floater = document.getElementById('floater');

  let board, score, gems, best, over;

  best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);

  let audioCtx = null, master = null, audioFailed = false, muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
  muteBtn.textContent = muted ? '🔇' : '♪';

  function initAudio() {
    if (audioCtx || audioFailed) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createGain();
      master.gain.value = 0.16;
      master.connect(audioCtx.destination);
    } catch (e) { audioFailed = true; }
  }
  function tone(freq, dur, type, gain, delay) {
    if (!audioCtx || muted) return;
    try {
      const t0 = audioCtx.currentTime + (delay || 0);
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'triangle';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain || 0.12, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  function sfxSlide() { tone(220, 0.05, 'sine', 0.04); }
  function sfxMerge() { tone(360, 0.08, 'triangle', 0.1); tone(520, 0.07, 'sine', 0.05, 0.03); }
  function sfxGem() { tone(660, 0.12, 'sine', 0.12); tone(990, 0.16, 'triangle', 0.08, 0.05); }
  function sfxLose() { tone(196, 0.18, 'sine', 0.08); tone(130, 0.28, 'triangle', 0.07, 0.08); }

  function emptyCells() {
    const out = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c] === 0) out.push([r, c]);
    return out;
  }

  function spawnValue() {
    const vals = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c] > 0) vals.push(board[r][c]);
    const mn = vals.length ? Math.min.apply(null, vals) : 2048;
    const x = Math.random();
    if (x < 0.50) return 2048;
    if (x < 0.75) return Math.max(mn, 4);
    return Math.max(mn / 2, 4);
  }

  function spawn(forced) {
    const empty = emptyCells();
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = forced || spawnValue();
  }

  function slideRow(row) {
    const nz = row.filter(v => v !== 0);
    const out = [];
    let gained = 0;
    let merges = 0;
    let i = 0;
    while (i < nz.length) {
      if (i + 1 < nz.length && nz[i] === nz[i + 1] && nz[i] > WIN) {
        out.push(nz[i] / 2);
        gained += nz[i];
        merges += 1;
        i += 2;
      } else {
        out.push(nz[i]);
        i += 1;
      }
    }
    while (out.length < SIZE) out.push(0);
    return { row: out, gained, merges };
  }

  const transpose = m => m[0].map((_, c) => m.map(r => r[c]));
  const reverseRows = m => m.map(r => [...r].reverse());
  function boardsEqual(a, b) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (a[r][c] !== b[r][c]) return false;
    return true;
  }

  function harvest(src) {
    const next = src.map(r => r.slice());
    const cut = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (next[r][c] === WIN) {
          cut.push([r, c]);
          next[r][c] = 0;
        }
      }
    }
    return { next, cut };
  }

  function applyMove(dir) {
    let b = board.map(r => r.slice());
    if (dir === 'right') b = reverseRows(b);
    else if (dir === 'up') b = transpose(b);
    else if (dir === 'down') b = reverseRows(transpose(b));

    let gained = 0, merges = 0;
    b = b.map(row => {
      const res = slideRow(row);
      gained += res.gained;
      merges += res.merges;
      return res.row;
    });

    if (dir === 'right') b = reverseRows(b);
    else if (dir === 'up') b = transpose(b);
    else if (dir === 'down') b = transpose(reverseRows(b));

    const slid = !boardsEqual(board, b);
    const harvested = harvest(b);
    return { next: harvested.next, cut: harvested.cut, gained, merges, slid };
  }

  function anyMovesLeft() {
    if (emptyCells().length) return true;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = board[r][c];
        if (v <= WIN) continue;
        if (c + 1 < SIZE && board[r][c + 1] === v) return true;
        if (r + 1 < SIZE && board[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  function digitClass(v) {
    const n = String(v).length;
    return 'd' + Math.max(1, Math.min(4, 5 - n));
  }

  function render() {
    boardEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement('div');
        const v = board[r][c];
        cell.className = 'cell';
        if (v > 0) {
          cell.className += ' v' + v + ' ' + digitClass(v);
          const span = document.createElement('span');
          span.textContent = v;
          cell.appendChild(span);
        }
        boardEl.appendChild(cell);
      }
    }
    scoreEl.textContent = score;
    gemsEl.textContent = gems;
    bestEl.textContent = best;
  }

  function pulseGems(n) {
    floater.textContent = n === 1 ? '◆ +1' : '◆ +' + n;
    floater.classList.remove('show');
    void floater.offsetWidth;
    floater.classList.add('show');
  }

  function newGame() {
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    gems = 0;
    over = false;
    overlay.classList.remove('show');
    spawn(2048);
    spawn(2048);
    render();
  }

  function move(dir) {
    if (over) return;
    initAudio();
    const res = applyMove(dir);
    if (!res.slid && res.cut.length === 0) return;

    board = res.next;
    score += res.gained;

    if (res.cut.length) {
      gems += res.cut.length;
      if (gems > best) {
        best = gems;
        try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      }
      pulseGems(res.cut.length);
      sfxGem();
    } else if (res.merges) {
      sfxMerge();
    } else {
      sfxSlide();
    }

    spawn();
    render();

    if (!anyMovesLeft()) {
      over = true;
      sfxLose();
      const line = gems
        ? ('You cut ' + gems + ' diamond' + (gems === 1 ? '' : 's') + '.')
        : 'No diamond this time. Pair stones until one becomes 2.';
      modalTitle.textContent = 'Vein closed';
      modalText.textContent = line + ' Score ' + score + '.';
      overlay.classList.add('show');
    }
  }

  const DIAGONALS = [
    { angle: -135, dir: 'left'  },
    { angle:  -45, dir: 'up'    },
    { angle:   45, dir: 'right' },
    { angle:  135, dir: 'down'  },
  ];
  function handleSwipe(dx, dy) {
    if (Math.hypot(dx, dy) < 24) return;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    let bestD = DIAGONALS[0], bestDiff = 999;
    for (const d of DIAGONALS) {
      const diff = Math.abs(((angle - d.angle + 540) % 360) - 180);
      if (diff < bestDiff) { bestDiff = diff; bestD = d; }
    }
    move(bestD.dir);
  }

  let ptr = null;
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('button, a')) return;
    ptr = { x: e.clientX, y: e.clientY };
  });
  document.addEventListener('pointerup', e => {
    if (!ptr) return;
    handleSwipe(e.clientX - ptr.x, e.clientY - ptr.y);
    ptr = null;
  });

  window.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowUp'    || k === 'w' || k === 'W') { move('up');    e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { move('right'); e.preventDefault(); }
    else if (k === 'ArrowDown'  || k === 's' || k === 'S') { move('down');  e.preventDefault(); }
    else if (k === 'ArrowLeft'  || k === 'a' || k === 'A') { move('left');  e.preventDefault(); }
    else if (k === 'n' || k === 'N') newGame();
    else if (k === 'm' || k === 'M') muteBtn.click();
  });

  document.querySelectorAll('.arrow').forEach(btn => {
    btn.addEventListener('click', () => move(btn.dataset.dir));
  });
  document.getElementById('newGame').addEventListener('click', newGame);
  document.getElementById('modalBtn').addEventListener('click', newGame);
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '♪';
    try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
    if (!muted) initAudio();
  });

  newGame();
})();
</script>
</body>
</html>
