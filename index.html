<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1033">
<title>Diamond 2048</title>
<style>
  :root {
    --bg: #1a1033;
    --panel: #2a1a4a;
    --cell: rgba(255,255,255,0.06);
    --text: #f6f3ff;
    --accent: #ffd166;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(ellipse at top, #2a1a4a 0%, var(--bg) 60%, #0a0520 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  header {
    width: 100%; max-width: 520px;
    padding: 14px 18px 6px;
    display: flex; justify-content: space-between; align-items: center;
  }
  h1 {
    margin: 0; font-size: clamp(20px, 5vw, 28px);
    letter-spacing: 2px; font-weight: 800;
    background: linear-gradient(135deg, #ffd166, #ef476f, #06d6a0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stats { display: flex; gap: 8px; }
  .stat {
    background: var(--panel); border-radius: 10px;
    padding: 6px 12px; font-size: 12px; text-align: center;
    min-width: 60px;
  }
  .stat b { display: block; font-size: 16px; color: var(--accent); }

  .board-wrap {
    flex: 1;
    width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
    touch-action: none;
  }
  .board {
    /* A square rotated 45° has diagonal = side * sqrt(2).
       So to fit in a container of size S, side = S / sqrt(2). */
    width: min(70vmin, 380px);
    height: min(70vmin, 380px);
    transform: rotate(45deg);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 6px;
    padding: 6px;
    background: var(--panel);
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.3);
  }
  .cell {
    background: var(--cell);
    border-radius: 6px;
    position: relative;
  }
  .tile {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    font-weight: 800;
    transform: rotate(-45deg);
    transition: transform 0.12s ease-out;
    animation: pop 0.16s ease-out;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  @keyframes pop {
    0% { transform: rotate(-45deg) scale(0.3); }
    70% { transform: rotate(-45deg) scale(1.1); }
    100% { transform: rotate(-45deg) scale(1); }
  }
  /* Font sizes — smaller for bigger numbers */
  .tile { font-size: clamp(12px, 3.2vmin, 20px); }
  .tile.d3 { font-size: clamp(14px, 3.8vmin, 24px); }
  .tile.d2 { font-size: clamp(16px, 4.4vmin, 28px); }
  .tile.d1 { font-size: clamp(20px, 5vmin, 32px); }

  /* Colors: hot (high) -> cool (low). Reaching 2 is gold. */
  .v2048 { background: linear-gradient(135deg, #8b0000, #ff2e4d); color: #fff; }
  .v1024 { background: linear-gradient(135deg, #b8390e, #ff6b35); color: #fff; }
  .v512  { background: linear-gradient(135deg, #c77800, #ff9f1c); color: #fff; }
  .v256  { background: linear-gradient(135deg, #9a8200, #ffd23f); color: #222; }
  .v128  { background: linear-gradient(135deg, #5a8f00, #a8dc00); color: #222; }
  .v64   { background: linear-gradient(135deg, #007f3f, #06d6a0); color: #fff; }
  .v32   { background: linear-gradient(135deg, #007c8f, #00b7d4); color: #fff; }
  .v16   { background: linear-gradient(135deg, #0b3d91, #118ab2); color: #fff; }
  .v8    { background: linear-gradient(135deg, #3a0ca3, #7209b7); color: #fff; }
  .v4    { background: linear-gradient(135deg, #6a1b9a, #c77dff); color: #fff; }
  .v2    { background: linear-gradient(135deg, #ffd700, #fff3a0); color: #222; box-shadow: 0 0 20px #ffd70088; }

  footer {
    width: 100%; max-width: 520px;
    padding: 10px 18px 18px;
    display: flex; flex-direction: column; gap: 10px; align-items: center;
  }
  .help {
    font-size: 12px; opacity: 0.7; text-align: center; line-height: 1.4;
  }
  button {
    background: var(--accent); color: #1a1033;
    border: none; border-radius: 10px;
    padding: 10px 20px; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 5, 30, 0.85);
    display: none;
    align-items: center; justify-content: center;
    z-index: 10;
    backdrop-filter: blur(6px);
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--panel);
    border-radius: 16px;
    padding: 24px 28px;
    text-align: center;
    max-width: 300px;
  }
  .modal h2 { margin: 0 0 10px; color: var(--accent); }
  .modal p { margin: 0 0 16px; opacity: 0.85; font-size: 14px; }
</style>
</head>
<body>
  <header>
    <h1>DIAMOND 2048</h1>
    <div class="stats">
      <div class="stat">SCORE<b id="score">0</b></div>
      <div class="stat">BEST<b id="best">0</b></div>
    </div>
  </header>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </div>

  <footer>
    <div class="help">
      Swipe diagonally (↖ ↗ ↙ ↘) to slide tiles. Matching tiles merge and <b>halve</b>.<br>
      Start at 2048 — reach <b>2</b> to win.
    </div>
    <button id="newGame">New Game</button>
  </footer>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">Game Over</h2>
      <p id="modalText">No more moves.</p>
      <button id="modalBtn">Play Again</button>
    </div>
  </div>

<script>
(() => {
  const SIZE = 4;
  const START_VALUE = 2048;
  const WIN_VALUE = 2;

  let board, score, best, won, over;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');

  best = parseInt(localStorage.getItem('d2048_best') || '0', 10);

  function newGame() {
    board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
    score = 0;
    won = false;
    over = false;
    spawn(); spawn();
    render();
    overlay.classList.remove('show');
  }

  function spawn() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c] === 0) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    // 90% spawn 2048, 10% spawn 1024 for variety
    board[r][c] = Math.random() < 0.9 ? START_VALUE : START_VALUE / 2;
  }

  function slideRow(row) {
    const nz = row.filter(v => v !== 0);
    const out = [];
    let gained = 0;
    let i = 0;
    while (i < nz.length) {
      if (i + 1 < nz.length && nz[i] === nz[i+1] && nz[i] > WIN_VALUE) {
        const merged = nz[i] / 2;
        out.push(merged);
        gained += nz[i]; // score = value of one of the merged tiles
        if (merged === WIN_VALUE) won = true;
        i += 2;
      } else {
        out.push(nz[i]);
        i++;
      }
    }
    while (out.length < SIZE) out.push(0);
    return { row: out, gained };
  }

  function transpose(m) {
    return m[0].map((_, c) => m.map(r => r[c]));
  }
  function reverseRows(m) {
    return m.map(r => [...r].reverse());
  }
  function boardsEqual(a, b) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (a[r][c] !== b[r][c]) return false;
    return true;
  }

  // dir: 'left' | 'right' | 'up' | 'down' in internal grid coords.
  // Screen diagonals map to these (see handleSwipe).
  function move(dir) {
    if (over) return;
    let b = board.map(r => [...r]);
    if (dir === 'right') b = reverseRows(b);
    else if (dir === 'up') b = transpose(b);
    else if (dir === 'down') b = reverseRows(transpose(b));

    let gained = 0;
    b = b.map(row => {
      const { row: nr, gained: g } = slideRow(row);
      gained += g;
      return nr;
    });

    if (dir === 'right') b = reverseRows(b);
    else if (dir === 'up') b = transpose(b);
    else if (dir === 'down') b = transpose(reverseRows(b));

    if (boardsEqual(board, b)) return;
    board = b;
    score += gained;
    if (score > best) {
      best = score;
      localStorage.setItem('d2048_best', String(best));
    }
    spawn();
    render();
    if (won) {
      showModal('You reached 2!', 'A tiny gold tile. Keep merging or start over.');
      won = false; // only show once
      return;
    }
    if (!anyMovesLeft()) {
      over = true;
      showModal('Game Over', 'No more diagonal merges. Score: ' + score);
    }
  }

  function anyMovesLeft() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c] === 0) return true;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const v = board[r][c];
        if (v <= WIN_VALUE) continue;
        if (c+1 < SIZE && board[r][c+1] === v) return true;
        if (r+1 < SIZE && board[r+1][c] === v) return true;
      }
    return false;
  }

  function digitClass(v) {
    const n = String(v).length;
    return 'd' + Math.max(1, Math.min(4, 5 - n));
  }

  function render() {
    boardEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const v = board[r][c];
        if (v > 0) {
          const tile = document.createElement('div');
          tile.className = `tile v${v} ${digitClass(v)}`;
          tile.textContent = v;
          cell.appendChild(tile);
        }
        boardEl.appendChild(cell);
      }
    }
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function showModal(title, text) {
    modalTitle.textContent = title;
    modalText.textContent = text;
    overlay.classList.add('show');
  }

  // ---------- Input ----------
  // Screen swipe -> grid direction (because board is rotated 45° clockwise):
  //   NE (dx>0, dy<0) -> right
  //   SE (dx>0, dy>0) -> down
  //   SW (dx<0, dy>0) -> left
  //   NW (dx<0, dy<0) -> up
  function handleSwipe(dx, dy) {
    const ax = Math.abs(dx), ay = Math.abs(dy);
    const min = 24;
    if (ax < min && ay < min) return;
    // Require roughly diagonal: neither axis overwhelmingly larger.
    // But always pick a diagonal based on signs.
    if (dx > 0 && dy < 0) move('right');
    else if (dx > 0 && dy > 0) move('down');
    else if (dx < 0 && dy > 0) move('left');
    else if (dx < 0 && dy < 0) move('up');
  }

  let touchStart = null;
  const wrap = document.getElementById('boardWrap');
  wrap.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  wrap.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    handleSwipe(t.clientX - touchStart.x, t.clientY - touchStart.y);
    touchStart = null;
  }, { passive: true });

  // Mouse drag for desktop
  let mouseStart = null;
  wrap.addEventListener('mousedown', e => {
    mouseStart = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('mouseup', e => {
    if (!mouseStart) return;
    handleSwipe(e.clientX - mouseStart.x, e.clientY - mouseStart.y);
    mouseStart = null;
  });

  // Keyboard: arrows/WASD act as diagonals.
  // Up=NW, Right=NE, Down=SE, Left=SW
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w')    { move('up');    e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd') { move('right'); e.preventDefault(); }
    else if (k === 'ArrowDown' || k === 's')  { move('down');  e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'a')  { move('left');  e.preventDefault(); }
    else if (k === 'n' || k === 'N') newGame();
  });

  document.getElementById('newGame').addEventListener('click', newGame);
  document.getElementById('modalBtn').addEventListener('click', newGame);

  newGame();
})();
</script>
</body>
</html>
