<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>Merge the Numbers</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1a1a2e;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}

.screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;position:fixed;top:0;left:0;z-index:100;background:#1a1a2e}
.screen.show{display:flex}

.title-logo{font-size:42px;font-weight:900;text-align:center;line-height:1.1;margin-bottom:8px}
.title-logo span{display:block;background:linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#9b59b6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.title-sub{font-size:15px;opacity:.7;margin-bottom:30px;text-align:center;max-width:320px;line-height:1.5}
.btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:800;border-radius:999px;color:#fff;padding:16px 40px;font-size:20px;background:linear-gradient(135deg,#e94560,#c23152);box-shadow:0 6px 20px rgba(233,69,96,.5);transition:transform .1s;margin:6px}
.btn:active{transform:scale(.95)}
.btn.sec{background:linear-gradient(135deg,#4d96ff,#3a7bd5);box-shadow:0 6px 20px rgba(77,150,255,.4)}
.btn.sm{padding:10px 20px;font-size:14px}
.btn:disabled{opacity:.4}
.back{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;z-index:10;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-size:18px}
.back:active{background:rgba(255,255,255,.3);transform:scale(.9)}

.hud{display:flex;align-items:center;justify-content:space-between;width:min(calc(100vw - 24px),400px);padding:6px 4px;font-weight:800}
.hud-score{color:#ffd700;font-size:22px}
.hud-best{font-size:12px;opacity:.6}
.hud-shuf{font-size:14px;color:#6bcb77}

.progress-wrap{position:relative;width:min(calc(100vw - 24px),400px);height:13px;background:rgba(255,255,255,.08);border-radius:999px;margin:4px 0 8px;overflow:hidden}
.progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#ffd700,#ff6b6b,#9b59b6);transition:width .4s ease}
.progress-txt{position:absolute;top:0;left:0;right:0;text-align:center;font-size:9px;font-weight:800;line-height:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}

.board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:8px;background:#16213e;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.4);width:min(calc(100vw - 24px),400px)}
.cell{aspect-ratio:1;border-radius:7px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;position:relative;overflow:hidden}
.cell.has-tile{box-shadow:0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.2)}
.cell.pop-in{animation:popIn .22s ease}
.cell.merge-pop{animation:mPop .24s ease;z-index:3}
.cell.just-moved{transition:transform .12s ease}
@keyframes popIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes mPop{0%{transform:scale(1)}35%{transform:scale(1.3)}100%{transform:scale(1)}}

/* Tile colors via data attribute */
.cell[data-v="1"]{background:#69f0ae}
.cell[data-v="2"]{background:#66bb6a}
.cell[data-v="3"]{background:#42a5f5}
.cell[data-v="4"]{background:#5c6bc0}
.cell[data-v="5"]{background:#ab47bc}
.cell[data-v="6"]{background:#7e57c2}
.cell[data-v="7"]{background:#ff9800}
.cell[data-v="8"]{background:#f4511e}
.cell[data-v="9"]{background:#ef5350}
.cell[data-v="10"]{background:#d32f2f}
.cell[data-v="11"]{background:#26a69a}
.cell[data-v="12"]{background:#00897b}
.cell[data-v="13"]{background:#ffa000}
.cell[data-v="14"]{background:#e53935}
.cell[data-v="15"]{background:#43a047}
.cell[data-v="16"]{background:#1e88e5}
.cell[data-v="17"]{background:#d81b60}
.cell[data-v="18"]{background:#f4511e}
.cell[data-v="19"]{background:#6d4c41}
.cell[data-v="20"]{background:linear-gradient(135deg,#ff6b6b,#ffd93d)}
.cell[data-v="21"],.cell[data-v="22"],.cell[data-v="23"],.cell[data-v="24"]{background:linear-gradient(135deg,#6bcb77,#4d96ff)}
.cell[data-v="25"],.cell[data-v="26"],.cell[data-v="27"],.cell[data-v="28"],.cell[data-v="29"]{background:linear-gradient(135deg,#9b59b6,#e94560)}
.cell[data-v="30"],.cell[data-v="31"],.cell[data-v="32"],.cell[data-v="33"],.cell[data-v="34"]{background:linear-gradient(135deg,#f39c12,#e74c3c)}
.cell[data-v="35"],.cell[data-v="36"],.cell[data-v="37"],.cell[data-v="38"],.cell[data-v="39"]{background:linear-gradient(135deg,#00b894,#00cec9)}
.cell[data-v="40"],.cell[data-v="41"],.cell[data-v="42"],.cell[data-v="43"],.cell[data-v="44"]{background:linear-gradient(135deg,#fd79a8,#e84393)}
.cell[data-v="45"],.cell[data-v="46"],.cell[data-v="47"],.cell[data-v="48"],.cell[data-v="49"]{background:linear-gradient(135deg,#ffeaa7,#fdcb6e);color:#333}
.cell[data-v="50"]{background:linear-gradient(135deg,#ffd700,#ff6b6b,#9b59b6,#4d96ff);box-shadow:0 0 16px rgba(255,215,0,.5)}

.particle{position:absolute;border-radius:50%;pointer-events:none;z-index:50;animation:pFly .5s ease-out forwards}
@keyframes pFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
.score-pop{position:absolute;pointer-events:none;z-index:60;font-weight:900;font-size:18px;color:#ffd700;text-shadow:0 2px 4px rgba(0,0,0,.5);animation:sPop .6s ease-out forwards;left:50%;top:0}
@keyframes sPop{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(.5)}30%{transform:translateX(-50%) translateY(-8px) scale(1.2)}100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(1)}}

/* On-screen D-pad */
.dpad-wrap{margin-top:10px;display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px;gap:6px;justify-content:center}
.dpad-btn{appearance:none;border:0;cursor:pointer;background:rgba(255,255,255,.1);color:#fff;font-size:20px;border-radius:10px;font-family:inherit;transition:transform .08s,background .1s;touch-action:manipulation}
.dpad-btn:active{transform:scale(.9);background:rgba(255,255,255,.25)}
.dpad-btn.up{grid-column:2;grid-row:1}
.dpad-btn.left{grid-column:1;grid-row:2}
.dpad-btn.down{grid-column:2;grid-row:2}
.dpad-btn.right{grid-column:3;grid-row:2}
.dpad-center{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,.45);font-weight:700;letter-spacing:.5px}

.bottom-bar{margin-top:10px;display:flex;gap:8px;align-items:center}
.bottom-bar .btn.sm{padding:10px 18px;font-size:13px}

.overlay-msg{text-align:center}
.overlay-msg h2{font-size:34px;margin:0 0 10px}
.overlay-msg p{font-size:16px;opacity:.8;margin:0 0 20px}
.overlay-msg .fs{font-size:28px;color:#ffd700;font-weight:900;margin-bottom:20px}

@media(max-width:360px){.board{gap:3px;padding:6px}.dpad-wrap{grid-template-columns:40px 40px 40px;grid-template-rows:40px 40px;gap:5px}}
</style>
</head>
<body>

<div id="scr-title" class="screen show">
  <a class="back" href="index.html" aria-label="Back to arcade">←</a>
  <div class="title-logo"><span>Merge the<br>Numbers</span></div>
  <div class="title-sub">Swipe up, down, left or right — all the numbers slide that way. Slide two matching numbers together and they merge into the next one! Score <b>2000</b> points to win.</div>
  <button class="btn" onclick="G.start()">Play!</button>
</div>

<div id="scr-game" class="screen">
  <div class="hud">
    <div><div class="hud-score" id="hScore">0</div><div class="hud-best" id="hBest">Best: 0</div></div>
    <div class="hud-shuf" id="hShuf">🔀 ×3</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progFill"></div>
    <div class="progress-txt" id="progTxt">0 / 2000</div>
  </div>
  <div class="board" id="board"></div>
  <div class="bottom-bar">
    <button class="btn sm sec" id="btnShuf" onclick="G.shuffle()">🔀 Shuffle</button>
    <button class="btn sm" style="background:rgba(255,255,255,.1);box-shadow:none" onclick="G.menu()">Menu</button>
  </div>
  <div class="dpad-wrap">
    <button class="dpad-btn up" onclick="G.move('up')">▲</button>
    <button class="dpad-btn left" onclick="G.move('left')">◀</button>
    <button class="dpad-btn right" onclick="G.move('right')">▶</button>
    <button class="dpad-btn down" onclick="G.move('down')">▼</button>
  </div>
</div>

<div id="scr-win" class="screen">
  <div class="overlay-msg">
    <h2 style="color:#ffd700">🎉 You Win! 🎉</h2>
    <p>You reached 2000 points!</p>
    <div class="fs" id="winSc">0</div>
    <button class="btn" onclick="G.start()">Play Again</button><br>
    <button class="btn sm sec" onclick="G.menu()">Menu</button>
  </div>
</div>

<div id="scr-lose" class="screen">
  <div class="overlay-msg">
    <h2>No More Moves!</h2>
    <p>The board is full.</p>
    <div class="fs" id="loseSc">0</div>
    <button class="btn" onclick="G.start()">Try Again</button><br>
    <button class="btn sm sec" onclick="G.menu()">Menu</button>
  </div>
</div>

<script>
var G = (function(){
  var N = 8, WIN = 2000, INIT = 2, SPAWN = 1, SHUF_PTS = 300, INIT_SHUF = 3;
  var grid, tid, score, best, shuffles, nextShuf, highest, busy;
  var cells = []; // DOM refs cells[r][c]
  var board = document.getElementById('board');

  best = parseInt(localStorage.getItem('mtnBest')||'0');

  function buildBoard(){
    board.innerHTML = '';
    cells = [];
    for(var r=0;r<N;r++){
      cells[r]=[];
      for(var c=0;c<N;c++){
        var d=document.createElement('div');
        d.className='cell';
        d.setAttribute('data-r',r);
        d.setAttribute('data-c',c);
        board.appendChild(d);
        cells[r][c]=d;
      }
    }
  }
  buildBoard();

  function renderCell(r,c,anim){
    var el=cells[r][c];
    var t=grid[r][c];
    el.className='cell';
    el.removeAttribute('data-v');
    el.textContent='';
    if(t){
      el.classList.add('has-tile');
      el.setAttribute('data-v', Math.min(t.value,50));
      el.textContent=t.value;
      var w=el.offsetWidth||40;
      var fs = t.value<=9 ? w*.45 : t.value<=20 ? w*.4 : t.value<=35 ? w*.35 : w*.3;
      el.style.fontSize=Math.max(11,fs)+'px';
      if(anim==='new') el.classList.add('pop-in');
      else if(anim==='merge') el.classList.add('merge-pop');
    } else {
      el.style.fontSize='';
    }
  }
  function renderAll(){
    for(var r=0;r<N;r++) for(var c=0;c<N;c++) renderCell(r,c);
  }

  function show(id){
    var ss=document.querySelectorAll('.screen');
    for(var i=0;i<ss.length;i++) ss[i].classList.remove('show');
    document.getElementById(id).classList.add('show');
  }

  function start(){
    grid=[];
    for(var r=0;r<N;r++){grid[r]=[];for(var c=0;c<N;c++) grid[r][c]=null;}
    tid=0;score=0;shuffles=INIT_SHUF;nextShuf=SHUF_PTS;highest=1;busy=false;
    show('scr-game');
    setTimeout(function(){
      spawnAt(2); // two starting tiles like 2048
      hud();
    },30);
  }

  // Spawn one tile in a random empty cell
  function spawn(){
    var empt=[];
    for(var r=0;r<N;r++) for(var c=0;c<N;c++) if(!grid[r][c]) empt.push([r,c]);
    if(!empt.length) return false;
    var s=empt[Math.floor(Math.random()*empt.length)];
    var v=pickSpawnValue();
    grid[s[0]][s[1]]={id:++tid,value:v};
    renderCell(s[0],s[1],'new');
    return true;
  }
  function spawnAt(n){
    for(var i=0;i<n;i++) spawn();
  }

  function pickSpawnValue(){
    var roll=Math.random();
    if(highest>=20&&roll<.14) return 3;
    else if(highest>=12&&roll<.28) return 2;
    else if(highest>=6&&roll<.16) return 2;
    else return 1;
  }

  // ---- 2048-style collapse ----
  // Move all tiles in `dir` ('up'|'down'|'left'|'right'). Returns points gained.
  // ---- 2048-style move ----
  // Moves all tiles toward `dir`. Returns true if the board changed.
  function move(dir){
    if(busy) return;
    busy=true;

    var gained=0;
    var mergeSpots=[]; // [r,c] of all tiles created by merging this move
    var anyChange=false;

    // Make a copy-preserving approach: build a fresh grid each move.
    var newGrid=[];
    for(var r0=0;r0<N;r0++){newGrid[r0]=[];for(var c0=0;c0<N;c0++) newGrid[r0][c0]=null;}

    for(var i=0;i<N;i++){
      // Gather values along the line, walking from the wall side inward.
      var vals=[]; // ordered so vals[0] is nearest the wall
      var coords=[];
      for(var j=0;j<N;j++){
        var pos=linePos(dir,i,j);
        coords.push(pos);
        if(grid[pos.r][pos.c]) vals.push(grid[pos.r][pos.c].value);
        else vals.push(null);
      }
      var line=vals.slice();
      var res=collapse(line); // res.vals array (length N, may contain null), res.gained
      gained+=res.gained;

      // Write resulting tiles into newGrid
      for(var k=0;k<N;k++){
        var vv=res.vals[k];
        if(vv!=null){
          var pc=coords[k];
          newGrid[pc.r][pc.c]={id:++tid,value:vv};
          if(res.mergedVals.indexOf(k)>=0) mergeSpots.push([pc.r,pc.c]);
        }
      }
      // Detect change for this line by comparing old vs new occupancy at each coord
      for(var k2=0;k2<N;k2++){
        var pc2=coords[k2];
        var old=grid[pc2.r][pc2.c];
        var neu=newGrid[pc2.r][pc2.c];
        var oldV = old?old.value:null;
        var newV = neu?neu.value:null;
        if(oldV!==newV) anyChange=true;
      }
    }

    if(!anyChange){ busy=false; return; } // no-op move

    grid=newGrid;

    // Scoring
    if(gained>0){
      score+=gained;
      while(score>=nextShuf){ shuffles++; nextShuf+=SHUF_PTS; }
    }

    renderAll();
    // Pop animation on merged tiles
    for(var m=0;m<mergeSpots.length;m++){
      cells[mergeSpots[m][0]][mergeSpots[m][1]].classList.add('merge-pop');
    }
    hud();

    // Spawn a new tile after the move settles
    setTimeout(function(){
      spawn();
      busy=false;
      hud();
      if(score>=WIN){
        setTimeout(function(){ document.getElementById('winSc').textContent=score; saveBest(); show('scr-win'); confetti(); },150);
      } else if(full()&&!anyMerge()){
        if(shuffles>0){ flashShuffleHint(); }
        else {
          setTimeout(function(){ document.getElementById('loseSc').textContent=score; saveBest(); show('scr-lose'); },150);
        }
      }
    },60);
  }

  // Map traversal index (i = line index, j = position along line, j=0 is wall side)
  function linePos(dir,i,j){
    if(dir==='left')  return {r:i, c:j};
    if(dir==='right') return {r:i, c:N-1-j};
    if(dir==='up')    return {r:j, c:i};
    if(dir==='down')  return {r:N-1-j, c:i};
  }

  // Collapse a line (already oriented with index 0 nearest the wall).
  // Returns {vals:[N], gained, mergedVals:[indices in vals that are new merge results]}
  function collapse(line){
    // 1) Compress: drop null gaps (tiles slide to the wall first)
    var c=[];
    for(var i2=0;i2<N;i2++) if(line[i2]!=null) c.push(line[i2]);
    // 2) Merge adjacent equal values (once each)
    var out=[];
    var gained=0;
    var mergedVals=[];
    var i=0;
    while(i<c.length){
      if(i+1<c.length && c[i]===c[i+1]){
        var nv=c[i]+1;
        out.push(nv);
        gained+=nv*10;
        mergedVals.push(out.length-1);
        i+=2;
      } else {
        out.push(c[i]);
        i+=1;
      }
    }
    // 3) Pad with nulls to length N
    var vals=[];
    for(var k=0;k<N;k++) vals.push(k<out.length?out[k]:null);
    return {vals:vals, gained:gained, mergedVals:mergedVals};
  }

  function shuffle(){
    if(busy||shuffles<=0) return;
    shuffles--;
    var ts=[];
    for(var r=0;r<N;r++) for(var c=0;c<N;c++) if(grid[r][c]) ts.push(grid[r][c]);
    for(var r2=0;r2<N;r2++) for(var c2=0;c2<N;c2++) grid[r2][c2]=null;
    var pos=[];
    for(var r3=0;r3<N;r3++) for(var c3=0;c3<N;c3++) pos.push([r3,c3]);
    for(var i=pos.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pos[i];pos[i]=pos[j];pos[j]=t;}
    for(var k=0;k<ts.length;k++){grid[pos[k][0]][pos[k][1]]=ts[k];}
    renderAll();
    for(var k2=0;k2<ts.length;k2++) cells[pos[k2][0]][pos[k2][1]].classList.add('pop-in');
    hud();
  }

  function full(){
    for(var r=0;r<N;r++) for(var c=0;c<N;c++) if(!grid[r][c]) return false;
    return true;
  }
  function anyMerge(){
    for(var r=0;r<N;r++) for(var c=0;c<N;c++){
      if(!grid[r][c]) continue;
      var v=grid[r][c].value;
      if(c+1<N&&grid[r][c+1]&&grid[r][c+1].value===v) return true;
      if(r+1<N&&grid[r+1][c]&&grid[r+1][c].value===v) return true;
    }
    return false;
  }

  function hud(){
    document.getElementById('hScore').textContent=score;
    document.getElementById('hBest').textContent='Best: '+best;
    document.getElementById('hShuf').textContent='\uD83D\uDD00 \u00D7'+shuffles;
    document.getElementById('btnShuf').disabled=shuffles<=0;
    var p=Math.min(100,Math.round(score/WIN*100));
    document.getElementById('progFill').style.width=p+'%';
    document.getElementById('progTxt').textContent=score+' / '+WIN;
  }
  function saveBest(){if(score>best){best=score;localStorage.setItem('mtnBest',''+best);}}

  var hintTimer=null;
  function flashShuffleHint(){
    var b=document.getElementById('btnShuf');
    b.style.transform='scale(1.12)';
    b.style.boxShadow='0 0 0 3px #ffd700, 0 6px 20px rgba(255,215,0,.6)';
    clearTimeout(hintTimer);
    hintTimer=setTimeout(function(){ b.style.transform=''; b.style.boxShadow=''; },900);
  }

  function scorePopAt(r,c,txt){
    var el=document.createElement('div');
    el.className='score-pop';
    el.textContent=txt;
    cells[r][c].appendChild(el);
    setTimeout(function(){el.remove()},600);
  }
  function confetti(){
    var cols=['#ffd700','#ff6b6b','#6bcb77','#4d96ff','#9b59b6','#e94560'];
    for(var i=0;i<50;i++){
      (function(idx){setTimeout(function(){
        var p=document.createElement('div');p.className='particle';
        var x=Math.random()*window.innerWidth,y=Math.random()*window.innerHeight*.4;
        var dx=(Math.random()-.5)*160,dy=60+Math.random()*160;
        var sz=5+Math.random()*7;
        p.style.cssText='position:fixed;width:'+sz+'px;height:'+sz+'px;left:'+x+'px;top:'+y+'px;background:'+cols[idx%6]+';--dx:'+dx+'px;--dy:'+dy+'px;z-index:999;';
        document.body.appendChild(p);
        setTimeout(function(){p.remove()},1000);
      },idx*20)})(i);
    }
  }

  // ---- Swipe input (touch) ----
  var sx=0, sy=0, st=0;
  board.addEventListener('touchstart', function(e){
    var t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();
  }, {passive:true});
  board.addEventListener('touchend', function(e){
    var t=e.changedTouches[0];
    var dx=t.clientX-sx, dy=t.clientY-sy;
    var ax=Math.abs(dx), ay=Math.abs(dy);
    var min=24;
    if(Math.max(ax,ay)<min) return;
    var dir;
    if(ax>ay) dir = dx>0 ? 'right':'left';
    else      dir = dy>0 ? 'down':'up';
    move(dir);
  }, {passive:true});
  // Mouse-drag fallback for desktop
  var mx=0,my=0,md=false;
  board.addEventListener('mousedown', function(e){ mx=e.clientX;my=e.clientY;md=true; });
  window.addEventListener('mouseup', function(e){
    if(!md) return; md=false;
    var dx=e.clientX-mx, dy=e.clientY-my;
    var ax=Math.abs(dx), ay=Math.abs(dy);
    if(Math.max(ax,ay)<24) return;
    var dir;
    if(ax>ay) dir=dx>0?'right':'left';
    else      dir=dy>0?'down':'up';
    move(dir);
  });

  // ---- Keyboard ----
  document.addEventListener('keydown', function(e){
    var k=e.key;
    var map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down','a':'left','d':'right','w':'up','s':'down'};
    if(map[k]){
      if(document.getElementById('scr-game').className.indexOf('show')>=0){
        e.preventDefault(); move(map[k]);
      }
    }
  });

  document.addEventListener('dblclick', function(e){e.preventDefault()});

  return {start:start, move:move, shuffle:shuffle, menu:function(){ location.href='index.html'; }};
})();
</script>
</body>
</html>
